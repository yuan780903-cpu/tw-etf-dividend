name: probe-mops (臨時測試,跑完刪除)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 -A "Mozilla/5.0" -X POST "https://mopsov.twse.com.tw/mops/web/ajax_t163sb04" -d "encodeURIComponent=1&step=1&firstin=1&off=1&isQuery=Y&TYPEK=sii&year=114&season=04" -o is.html -w "MOPS財報 %{http_code} %{size_download}\n" || echo "MOPS財報 失敗"
          grep -c "hasBorder" is.html || true
          curl -s -m 60 -A "Mozilla/5.0" "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_10_0.html" -o rev.html -w "月營收 %{http_code} %{size_download}\n" || echo "月營收 失敗"
