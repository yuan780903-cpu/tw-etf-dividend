name: 每日更新ETF資料
on:
  schedule:
    - cron: "40 7 * * 1-5"    # 台灣 15:40(收盤後,證交所/櫃買當日行情出來)
    - cron: "30 13 * * 1-5"   # 台灣 21:30(補配息公告、持股)
    - cron: "30 14 * * 1-5"   # 台灣 22:30(融資融券、整戶維持率、追繳於 21:30 後才公布)
  workflow_dispatch:            # 網頁「一鍵更新」或 GitHub 頁面手動觸發
    inputs:
      mode:
        description: "quick=快速(只更新大盤/法人/籌碼,約3分) full=完整 ptt=只算PTT熱度(iPhone上傳後)"
        default: full
        type: choice
        options: [full, quick, ptt]
permissions:
  contents: write
concurrency:
  group: etf-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                      # 排隊等前一次跑完時,也要拿最新的程式與資料
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 還原市場廣度快取(近一年全部個股收盤價,不進 git)
        if: github.event.inputs.mode != 'ptt'
        uses: actions/cache@v4
        with:
          path: data/breadth/raw
          key: breadth-${{ github.run_id }}
          restore-keys: breadth-
      - name: 還原財報快取(fundamentals.json 太大不進 git;快速模式的籌碼/本益比要用)
        if: github.event.inputs.mode != 'ptt'
        uses: actions/cache@v4
        with:
          path: data/fund/fundamentals.json
          key: fund-${{ github.run_id }}
          restore-keys: fund-
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TZ: Asia/Taipei
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: python -u scripts/update.py
      - name: 存回 repo
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}                     # 前面抓資料就算失敗或逾時,已抓到的也要存(先驗證:抓壞的檔案會自動還原上一版)
        run: |
          python -u scripts/validate.py || true
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資料更新${MODE:+($MODE)} $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do                 # 執行期間若有人推了新程式,先合併再推(資料以這次為準)
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
